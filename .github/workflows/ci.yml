name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-release
            preset: release
          - name: linux-x86_64-debug-sanitized
            preset: sanitized
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install complexity checker
        if: matrix.preset == 'sanitized'
        run: python -m pip install lizard==1.26.0
      - name: Build, test and package release
        if: matrix.preset == 'release'
        run: scripts/linux-release.sh
      - name: Configure sanitizer build
        if: matrix.preset == 'sanitized'
        run: CC=clang-23 CXX=clang++-23 cmake --preset sanitized
      - name: Build sanitizer tests
        if: matrix.preset == 'sanitized'
        run: cmake --build --preset sanitized --parallel 2
      - name: Test with ASan, LSan and UBSan
        if: matrix.preset == 'sanitized'
        run: ctest --preset sanitized --no-tests=error
      - name: Code quality
        if: matrix.preset == 'sanitized'
        run: cmake --build build/sanitized --target format-check lint complexity
      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'release'
        with:
          name: linux-x86_64
          path: dist/linux/*
          if-no-files-found: error
