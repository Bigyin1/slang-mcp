name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install complexity checker
        run: python -m pip install lizard==1.26.0
      - name: Configure development build
        run: CC=clang-23 CXX=clang++-23 cmake --preset dev
      - name: Native checks
        run: make check
      - name: Build, test and package Linux release
        run: scripts/linux-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux/*
          if-no-files-found: error
