[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "slang-mcp"
version = "0.1.0"
description = "Read-only MCP server for semantic SystemVerilog project analysis"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "slang-mcp contributors" }]
dependencies = [
  "mcp>=1.27,<2",
  "pyslang==11.0.0",
]

[project.scripts]
slang-mcp = "slang_mcp.__main__:main"

[dependency-groups]
dev = [
  "gitpython>=3.1,<4",
  "mypy>=2.3,<2.4",
  "matplotlib>=3.10,<3.11",
  "pylint>=4.0.8,<5",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.16,<0.17",
  "xenon>=0.9,<0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slang_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: integration tests across service and MCP boundaries",
  "realworld: network-backed tests against pinned open-source RTL",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
  "A", "ARG", "B", "C4", "C90", "DTZ", "E", "ERA", "F", "FLY", "G",
  "I", "ICN", "INP", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PTH",
  "PT", "Q", "RET", "RUF", "S", "SIM", "SLOT", "TRY", "UP", "W",
]
ignore = [
  "TRY003",  # Domain exceptions intentionally own their detailed messages.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 6
max-locals = 5
max-returns = 4
max-statements = 35

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "PLR2004", # Literal expected values make focused semantic tests clearer.
  "S101", # Assertions are the pytest API.
]
"tests/realworld/bender.py" = [
  "S603", # Commands use fixture inputs and a developer-selected Bender binary.
]

"benchmarks/reporting/*.py" = [
  "RUF001", # Russian report labels intentionally contain Cyrillic text.
]
"benchmarks/runner/process.py" = [
  "S603", # Argument vectors are built by the controller, never by an agent answer.
]
"benchmarks/runner/projects.py" = [
  "S603", # Bender command arguments come from the versioned project manifest.
]
"benchmarks/adapters/preflight.py" = [
  "S603", # Read-only CLI inspection with a fixed argument vector.
]
"benchmarks/adapters/copilot.py" = [
  "S603", # Uses the user-requested system CLI, resolved with shutil.which.
]
"benchmarks/runner/schedule.py" = [
  "S311", # Seeded experimental randomization, not cryptography.
]
"benchmarks/reporting/statistics.py" = [
  "RUF001", "S311", # Russian labels and reproducible statistical resampling.
]

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true
warn_unreachable = true
files = ["src", "tests", "benchmarks"]

[tool.pylint.main]
py-version = "3.10"
persistent = false
load-plugins = [
  "pylint.extensions.bad_builtin",
  "pylint.extensions.broad_try_clause",
  "pylint.extensions.check_elif",
  "pylint.extensions.code_style",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.confusing_elif",
  "pylint.extensions.consider_refactoring_into_while_condition",
  "pylint.extensions.consider_ternary_expression",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.for_any_all",
  "pylint.extensions.no_self_use",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.redefined_variable_type",
  "pylint.extensions.set_membership",
]

[tool.pylint.format]
max-line-length = 100
# The dynamic Slang adapter groups related queries in one module.
max-module-lines = 500

[tool.pylint.design]
max-args = 5
max-positional-arguments = 5
max-bool-expr = 4
max-branches = 6
max-locals = 5
max-returns = 4
max-statements = 35

[tool.pylint.refactoring]
max-nested-blocks = 3

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "missing-class-docstring",
  "missing-function-docstring",
  "redefined-outer-name",
  "too-few-public-methods",
  "too-many-instance-attributes",
]

[tool.pylint.typecheck]
ignored-modules = ["pyslang"]

[[tool.mypy.overrides]]
module = ["pyslang", "pyslang.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
